name: Isolated release verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run build:packages
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:validate
      - run: npm run test:unit
      - run: npm test
      - run: npm run build -w @merkat/web -- --webpack
      - run: npm run build -w @merkat/worker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:components
# No deployment, production env, hosted database or repository write permissions.
