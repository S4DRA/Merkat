services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Database is reachable only inside the Compose network.
  migrate:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile
    command: npm run db:migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the postgres service}
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile
    command: npm run dev -w @merkat/web -- --hostname 0.0.0.0
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the postgres service}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      AUTH_RATE_LIMIT_SECRET: ${AUTH_RATE_LIMIT_SECRET:?Set AUTH_RATE_LIMIT_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../../apps/web/src:/workspace/apps/web/src
      - ../../apps/web/public:/workspace/apps/web/public
    init: true
volumes:
  postgres-data:
